<!DOCTYPE html>
<html>
<head>
    <title>Mini Google da Wikipedia</title>
    <style>
        body { font-family: Arial; padding: 40px; background: #f3f3f3; }
        input, button { padding: 10px; font-size: 16px; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px #ccc; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🔎 Buscar na Wikipedia</h2>
        <form method="post">
            <input type="text" name="consulta" placeholder="Digite sua pesquisa..." required>
            <button type="submit">Buscar</button>
        </form>
        {% if resultado %}
            <hr>
            <h3>{{ titulo }}</h3>
            <p>{{ resultado }}</p>
            {% if link %}
                <a href="{{ link }}" target="_blank">Ler mais na Wikipedia</a>
            {% endif %}
        {% endif %}
    </div>
</body>
</html>
